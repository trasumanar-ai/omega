_meta:
  version: "0.1.0"
  updated: 2026-02-15
  status: draft
  root: true

project:
  name: omega
  tagline: Discit simülasyon ortamı

intent: |
  Phase 1: Tek discit instance'ını simüle platformlara bağlayıp test et.
  Phase 2: Birden fazla discit + müşteriler → sanal ekonomi.

overview: |
  Omega üç ana bileşenden oluşur:

  PLATFORMS (platforms/) — Simüle dış dünya servisleri
    - chat        mesajlaşma platformu (WhatsApp yerine)
    - ads         reklam platformu (Meta Ads yerine)
    - ecommerce   e-ticaret platformu (Shopify yerine)
    Tek FastAPI servisi olarak çalışır.             :20000

  DISCITS (discits/) — Discit instance bağlantıları
    - Tek instance config (MVP)

  CUSTOMERS (customers/) — Müşteri simülasyonu (sonra)

  Port şeması:
    Discit:    5432-5434, 8010-8030
    Platforms: 20000

structure:
  directories:
    platforms/:
      desc: Simüle platform servisleri (chat, ads, ecommerce)
    discits/:
      desc: Discit instance bağlantı config'leri
    customers/:
      desc: Müşteri simülasyonu (Phase 2)
