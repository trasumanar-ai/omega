<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omega Chat</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --header-bg: #075e54;
  --header-light: #128c7e;
  --chat-bg: #e5ddd5;
  --outbound-bg: #dcf8c6;
  --inbound-bg: #fff;
  --sidebar-bg: #fff;
  --sidebar-hover: #f5f5f5;
  --sidebar-active: #ebebeb;
  --border: #e0e0e0;
  --text-primary: #111b21;
  --text-secondary: #667781;
  --text-time: #667781;
  --badge-bg: #25d366;
  --tick-grey: #8696a0;
  --tick-blue: #53bdeb;
  --shadow: 0 1px 0.5px rgba(11,20,26,.13);
}

html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: #ddd; }

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 1600px;
  margin: 0 auto;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0,0,0,.15);
}

/* ── Header ── */
.header {
  background: var(--header-bg);
  color: #fff;
  padding: 10px 16px;
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  z-index: 10;
}
.header-logo {
  width: 28px; height: 28px;
  background: rgba(255,255,255,.2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.header .subtitle {
  font-size: 11px;
  font-weight: 400;
  opacity: .6;
  margin-left: auto;
}

/* ── Main layout ── */
.main {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── Sidebar ── */
.sidebar {
  width: 360px;
  min-width: 360px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 10px 16px;
  background: #f0f2f5;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
}
.sidebar-list {
  flex: 1;
  overflow-y: auto;
}
.sidebar-list::-webkit-scrollbar { width: 6px; }
.sidebar-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

.conv-item {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  cursor: pointer;
  border-bottom: 1px solid #f0f2f5;
  gap: 12px;
  transition: background .1s;
}
.conv-item:hover { background: var(--sidebar-hover); }
.conv-item.active { background: var(--sidebar-active); }

.conv-avatar {
  width: 49px;
  height: 49px;
  border-radius: 50%;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 600;
  flex-shrink: 0;
  text-transform: uppercase;
}
.conv-info {
  flex: 1;
  min-width: 0;
}
.conv-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 3px;
}
.conv-name {
  font-size: 16px;
  font-weight: 400;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.conv-time {
  font-size: 12px;
  color: var(--text-time);
  flex-shrink: 0;
  margin-left: 8px;
}
.conv-time.unread { color: var(--badge-bg); font-weight: 600; }
.conv-bottom {
  display: flex;
  align-items: center;
  gap: 4px;
}
.conv-preview {
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.conv-preview .tick { flex-shrink: 0; }
.conv-badge {
  background: var(--badge-bg);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  border-radius: 50%;
  min-width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 5px;
  flex-shrink: 0;
}

/* ── Chat panel ── */
.chat-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--chat-bg);
  position: relative;
}

/* WP doodle pattern */
.chat-panel::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: .06;
  background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='p' width='40' height='40' patternUnits='userSpaceOnUse'%3E%3Ccircle cx='5' cy='5' r='1.5' fill='%23000'/%3E%3Ccircle cx='25' cy='20' r='1' fill='%23000'/%3E%3Ccircle cx='15' cy='35' r='1.2' fill='%23000'/%3E%3Ccircle cx='35' cy='10' r='0.8' fill='%23000'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='200' height='200' fill='url(%23p)'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

.chat-header {
  background: #f0f2f5;
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  z-index: 1;
}
.chat-header .conv-avatar { width: 40px; height: 40px; font-size: 15px; }
.chat-header-info { flex: 1; }
.chat-header-name { font-size: 16px; font-weight: 500; color: var(--text-primary); }
.chat-header-sub { font-size: 13px; color: var(--text-secondary); }

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 60px 16px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  z-index: 1;
  position: relative;
}
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,.2); border-radius: 3px; }

/* ── Date separator ── */
.date-sep {
  align-self: center;
  background: #e1f2fb;
  color: #54656f;
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 8px;
  margin: 8px 0;
  box-shadow: var(--shadow);
  font-weight: 500;
}

/* ── Message bubbles ── */
.msg-row {
  display: flex;
  flex-direction: column;
  max-width: 65%;
  margin: 1px 0;
}
.msg-row.inbound { align-self: flex-start; }
.msg-row.outbound { align-self: flex-end; }
.msg-row.tail { margin-top: 4px; }

.msg-bubble {
  padding: 6px 8px 6px 9px;
  border-radius: 8px;
  position: relative;
  line-height: 1.35;
  font-size: 14.2px;
  word-wrap: break-word;
  box-shadow: var(--shadow);
}
.msg-row.inbound .msg-bubble {
  background: var(--inbound-bg);
  border-top-left-radius: 0;
}
.msg-row.outbound .msg-bubble {
  background: var(--outbound-bg);
  border-top-right-radius: 0;
}

/* Bubble tails */
.msg-row.inbound.tail .msg-bubble::before {
  content: '';
  position: absolute;
  top: 0; left: -8px;
  width: 0; height: 0;
  border-top: 0 solid transparent;
  border-right: 8px solid var(--inbound-bg);
  border-bottom: 8px solid transparent;
}
.msg-row.outbound.tail .msg-bubble::after {
  content: '';
  position: absolute;
  top: 0; right: -8px;
  width: 0; height: 0;
  border-top: 0 solid transparent;
  border-left: 8px solid var(--outbound-bg);
  border-bottom: 8px solid transparent;
}

.msg-body {
  display: inline;
  white-space: pre-wrap;
}
.msg-meta {
  float: right;
  display: flex;
  align-items: center;
  gap: 3px;
  margin: 4px 0 -4px 12px;
  white-space: nowrap;
}
.msg-time {
  font-size: 11px;
  color: var(--text-time);
}

/* ── Ticks ── */
.tick {
  display: inline-flex;
  align-items: center;
  margin-left: 2px;
  line-height: 1;
}
.tick svg { width: 16px; height: 11px; }
.tick.sent svg { color: var(--tick-grey); }
.tick.delivered svg { color: var(--tick-grey); }
.tick.read svg { color: var(--tick-blue); }

/* ── Empty state ── */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  background: #f0f2f5;
  z-index: 1;
}
.empty-state-icon {
  width: 260px;
  height: 260px;
  margin-bottom: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #d9fdd3 0%, #e3f2fd 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}
.empty-state-icon svg { width: 100px; height: 100px; opacity: .3; }
.empty-state h2 {
  font-size: 28px;
  font-weight: 300;
  color: #41525d;
  margin-bottom: 12px;
}
.empty-state p {
  font-size: 14px;
  color: #667781;
  max-width: 480px;
  text-align: center;
  line-height: 1.5;
}

/* ── Footer ── */
.footer {
  background: #f0f2f5;
  border-top: 1px solid var(--border);
  padding: 5px 16px;
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
  flex-shrink: 0;
  z-index: 10;
}
.footer .dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
  transition: background .3s;
}
.footer .dot.connected { background: var(--badge-bg); }
.footer .dot.disconnected { background: #e74c3c; }

/* ── Responsive ── */
@media (max-width: 720px) {
  .sidebar { width: 100%; min-width: 100%; }
  .main.show-chat .sidebar { display: none; }
  .main:not(.show-chat) .chat-panel { display: none; }
  .chat-messages { padding: 8px 12px 16px; }
  .msg-row { max-width: 85%; }
  .back-btn { display: flex !important; }
}
.back-btn {
  display: none;
  background: none;
  border: none;
  color: var(--header-light);
  font-size: 22px;
  cursor: pointer;
  padding: 4px 8px 4px 0;
  align-items: center;
}

/* ── Profile Panel ── */
.profile-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s, visibility .25s;
}
.profile-overlay.open { opacity: 1; visibility: visible; }

.profile-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 420px;
  max-width: 100vw;
  height: 100vh;
  background: #fff;
  z-index: 101;
  transform: translateX(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: -2px 0 12px rgba(0,0,0,.15);
}
.profile-panel.open { transform: translateX(0); }

.profile-header {
  background: var(--header-bg);
  color: #fff;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.profile-header-back {
  background: none;
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
}
.profile-header-title {
  font-size: 16px;
  font-weight: 500;
}

.profile-body {
  flex: 1;
  overflow-y: auto;
  background: #f0f2f5;
}
.profile-body::-webkit-scrollbar { width: 6px; }
.profile-body::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

.profile-hero {
  background: #fff;
  text-align: center;
  padding: 28px 16px 20px;
  margin-bottom: 8px;
}
.profile-hero-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 600;
  margin: 0 auto 12px;
  text-transform: uppercase;
}
.profile-hero-name {
  font-size: 20px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.profile-hero-phone {
  font-size: 14px;
  color: var(--text-secondary);
}

.profile-section {
  background: #fff;
  margin-bottom: 8px;
  padding: 16px;
}
.profile-section-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--header-bg);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 10px;
}
.profile-field {
  margin-bottom: 10px;
}
.profile-field:last-child { margin-bottom: 0; }
.profile-field-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 2px;
}
.profile-field-value {
  font-size: 14px;
  color: var(--text-primary);
  line-height: 1.45;
}

/* Patience bar */
.patience-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
}
.patience-track {
  flex: 1;
  height: 8px;
  background: #e0e0e0;
  border-radius: 4px;
  overflow: hidden;
}
.patience-fill {
  height: 100%;
  border-radius: 4px;
  background: var(--badge-bg);
  transition: width .3s;
}
.patience-label {
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
}

/* System prompt collapsible */
.prompt-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
}
.prompt-toggle-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: background .15s;
}
.prompt-toggle-btn:hover { background: #f0f2f5; }
.prompt-content {
  display: none;
  margin-top: 10px;
}
.prompt-content.open { display: block; }
.prompt-content pre {
  background: #1e1e1e;
  color: #d4d4d4;
  font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
  font-size: 12px;
  line-height: 1.5;
  padding: 12px;
  border-radius: 8px;
  white-space: pre-wrap;
  word-wrap: break-word;
  max-height: 300px;
  overflow-y: auto;
}
.prompt-content pre::-webkit-scrollbar { width: 6px; }
.prompt-content pre::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

/* Tool chips */
.tool-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.tool-chip {
  background: #e8f5e9;
  color: #2e7d32;
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 12px;
  font-family: "SF Mono", monospace;
}

/* Discit section */
.discit-info {
  display: flex;
  align-items: center;
  gap: 10px;
}
.discit-logo {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
}
.discit-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.4;
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-logo">&#937;</div>
    <span>Omega Chat</span>
    <span class="subtitle">read-only viewer</span>
  </div>

  <div class="main" id="main">
    <div class="sidebar">
      <div class="sidebar-header" id="sidebar-header">Konuşmalar</div>
      <div class="sidebar-list" id="sidebar-list"></div>
    </div>

    <div class="chat-panel" id="chat-panel">
      <div class="empty-state" id="empty-state">
        <div class="empty-state-icon">
          <svg viewBox="0 0 303 172" fill="none"><path d="M229 80c0 38.1-43.6 69-97.5 69a116 116 0 0 1-35.2-5.4C79.5 155 60 164 60 164s13-16.7 15.3-30C52.3 121.4 34 101.8 34 80c0-38.1 43.6-69 97.5-69S229 41.9 229 80Z" fill="#54656f" opacity=".3"/><path d="M269 92c0 28.7-32.8 52-73.4 52a87 87 0 0 1-26.5-4.1c-12.2 8.7-26.8 14.1-26.8 14.1s9.8-12.6 11.5-22.6C136.3 122.1 122 108.4 122 92c0-28.7 32.8-52 73.4-52S269 63.3 269 92Z" fill="#54656f" opacity=".15"/></svg>
        </div>
        <h2>Omega Chat Viewer</h2>
        <p>Simülasyondaki konuşmaları buradan canlı izleyebilirsiniz.<br>Soldaki listeden bir konuşma seçin.</p>
      </div>
      <div id="chat-view" style="display:none;flex-direction:column;flex:1;min-height:0">
        <div class="chat-header" id="chat-header">
          <button class="back-btn" id="back-btn" onclick="showSidebar()">&#8592;</button>
          <div class="conv-avatar" id="chat-avatar"></div>
          <div class="chat-header-info">
            <div class="chat-header-name" id="chat-name"></div>
            <div class="chat-header-sub" id="chat-phone"></div>
          </div>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="dot disconnected" id="ws-dot"></span>
    <span id="ws-status">Bağlanıyor...</span>
  </div>

  <!-- Profile Panel -->
  <div class="profile-overlay" id="profile-overlay"></div>
  <div class="profile-panel" id="profile-panel">
    <div class="profile-header">
      <button class="profile-header-back" id="profile-close">&larr;</button>
      <span class="profile-header-title">Profil Bilgisi</span>
    </div>
    <div class="profile-body" id="profile-body">
      <div style="text-align:center;padding:40px;color:#8696a0">Yükleniyor...</div>
    </div>
  </div>
</div>

<script>
(function() {
  const BASE = location.pathname.replace(/\/$/, '');
  let contacts = {};
  let conversations = {};
  let activeChatId = null;
  let unreadCounts = {};

  // Avatar renkleri
  const COLORS = [
    '#00a884','#0091eb','#7c40be','#c73585','#ef6c00',
    '#009688','#5b6abf','#ad1457','#00897b','#6d4c41',
  ];
  function avatarColor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = ((h << 5) - h + id.charCodeAt(i)) | 0;
    return COLORS[Math.abs(h) % COLORS.length];
  }

  // ── Tick SVGs ──
  const TICK_SINGLE = '<svg viewBox="0 0 16 11"><path d="M11.07 0.66L4.78 6.95 2.37 4.54 1.29 5.62 4.78 9.12 12.15 1.74z" fill="currentColor"/></svg>';
  const TICK_DOUBLE = '<svg viewBox="0 0 16 11"><path d="M11.07 0.66L4.78 6.95 2.37 4.54 1.29 5.62 4.78 9.12 12.15 1.74z" fill="currentColor"/><path d="M14.07 0.66L7.78 6.95 6.62 5.79 5.54 6.87 7.78 9.12 15.15 1.74z" fill="currentColor"/></svg>';

  function tickHtml(status) {
    if (!status || status === 'received') return '';
    if (status === 'sent') return '<span class="tick sent">' + TICK_SINGLE + '</span>';
    if (status === 'delivered') return '<span class="tick delivered">' + TICK_DOUBLE + '</span>';
    return '<span class="tick read">' + TICK_DOUBLE + '</span>';
  }

  // ── DOM refs ──
  const sidebarList = document.getElementById('sidebar-list');
  const sidebarHeader = document.getElementById('sidebar-header');
  const emptyState = document.getElementById('empty-state');
  const chatView = document.getElementById('chat-view');
  const chatMessages = document.getElementById('chat-messages');
  const chatName = document.getElementById('chat-name');
  const chatPhone = document.getElementById('chat-phone');
  const chatAvatar = document.getElementById('chat-avatar');
  const mainEl = document.getElementById('main');
  const wsDot = document.getElementById('ws-dot');
  const wsStatus = document.getElementById('ws-status');

  // ── Init ──
  async function init() {
    try {
      const [contactsRes, convsRes] = await Promise.all([
        fetch(BASE + '/api/contacts'),
        fetch(BASE + '/api/conversations'),
      ]);
      contacts = await contactsRes.json();
      const convList = await convsRes.json();
      for (const c of convList) {
        conversations[c.chat_id] = {
          name: c.name,
          last_message: c.last_message,
          last_timestamp: c.last_timestamp,
          last_direction: null,
          last_status: null,
          count: c.count,
          msgs: null,
        };
      }
      renderSidebar();
    } catch (e) {
      console.error('Init failed:', e);
    }
    connectWS();
  }

  // ── Sidebar ──
  function renderSidebar() {
    const sorted = Object.entries(conversations).sort(
      (a, b) => (b[1].last_timestamp || '').localeCompare(a[1].last_timestamp || '')
    );
    const count = sorted.length;
    sidebarHeader.textContent = count > 0 ? 'Konuşmalar (' + count + ')' : 'Konuşmalar';

    sidebarList.innerHTML = '';
    for (const [chatId, conv] of sorted) {
      const el = document.createElement('div');
      el.className = 'conv-item' + (chatId === activeChatId ? ' active' : '');
      el.onclick = () => selectChat(chatId);

      const name = conv.name || chatId;
      const initials = name.split(' ').map(w => w[0]).join('').slice(0, 2);
      const time = formatTime(conv.last_timestamp);
      const preview = conv.last_message || '';
      const unread = unreadCounts[chatId] || 0;
      const color = avatarColor(chatId);

      // Sidebar preview'da outbound mesaj tick'i
      const previewTick = conv.last_direction === 'outbound' ? tickHtml(conv.last_status || 'sent') : '';

      el.innerHTML =
        '<div class="conv-avatar" style="background:' + color + '">' + esc(initials) + '</div>' +
        '<div class="conv-info">' +
          '<div class="conv-top">' +
            '<span class="conv-name">' + esc(name) + '</span>' +
            '<span class="conv-time' + (unread > 0 ? ' unread' : '') + '">' + esc(time) + '</span>' +
          '</div>' +
          '<div class="conv-bottom">' +
            previewTick +
            '<span class="conv-preview">' + esc(preview) + '</span>' +
            (unread > 0 ? '<div class="conv-badge">' + unread + '</div>' : '') +
          '</div>' +
        '</div>';

      sidebarList.appendChild(el);
    }
  }

  // ── Chat selection ──
  async function selectChat(chatId) {
    activeChatId = chatId;
    unreadCounts[chatId] = 0;

    emptyState.style.display = 'none';
    chatView.style.display = 'flex';
    mainEl.classList.add('show-chat');

    const conv = conversations[chatId];
    const name = conv?.name || contacts[chatId] || chatId;
    const color = avatarColor(chatId);
    chatName.textContent = name;
    chatPhone.textContent = formatPhone(chatId);
    chatAvatar.textContent = name.split(' ').map(w => w[0]).join('').slice(0, 2);
    chatAvatar.style.background = color;

    if (!conv || !conv.msgs) {
      chatMessages.innerHTML = '<div style="text-align:center;padding:20px;color:#8696a0;font-size:13px">Mesajlar yükleniyor...</div>';
      try {
        const res = await fetch(BASE + '/api/conversations/' + chatId);
        const msgs = await res.json();
        if (!conversations[chatId]) {
          conversations[chatId] = { name, last_message: '', last_timestamp: '', last_direction: null, last_status: null, count: 0, msgs: [] };
        }
        conversations[chatId].msgs = msgs;
      } catch (e) {
        console.error('Failed to load messages:', e);
      }
    }
    renderMessages();
    renderSidebar();
  }

  function renderMessages() {
    chatMessages.innerHTML = '';
    const conv = conversations[activeChatId];
    if (!conv || !conv.msgs || conv.msgs.length === 0) {
      chatMessages.innerHTML = '<div style="text-align:center;padding:40px;color:#8696a0;font-size:13px">Henüz mesaj yok</div>';
      return;
    }

    let lastDate = '';
    let lastDirection = '';
    for (const msg of conv.msgs) {
      const date = formatDate(msg.timestamp);
      if (date && date !== lastDate) {
        const sep = document.createElement('div');
        sep.className = 'date-sep';
        sep.textContent = date;
        chatMessages.appendChild(sep);
        lastDate = date;
        lastDirection = '';
      }
      const showTail = msg.direction !== lastDirection;
      appendMessageBubble(msg, showTail);
      lastDirection = msg.direction;
    }
    scrollToBottom();
  }

  function appendMessageBubble(msg, showTail) {
    const dir = msg.direction === 'outbound' ? 'outbound' : 'inbound';
    const row = document.createElement('div');
    row.className = 'msg-row ' + dir + (showTail ? ' tail' : '');

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    const time = formatTime(msg.timestamp);
    const tick = dir === 'outbound' ? tickHtml(msg.status || 'sent') : '';

    bubble.innerHTML =
      '<span class="msg-body">' + esc(msg.body || '') + '</span>' +
      '<span class="msg-meta">' +
        '<span class="msg-time">' + esc(time) + '</span>' +
        tick +
      '</span>';

    row.appendChild(bubble);
    chatMessages.appendChild(row);
    return row;
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });
  }

  // ── WebSocket ──
  let ws = null;

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + BASE + '/ws');

    ws.onopen = () => {
      wsDot.className = 'dot connected';
      wsStatus.textContent = 'Canlı';
    };

    ws.onclose = () => {
      wsDot.className = 'dot disconnected';
      wsStatus.textContent = 'Bağlantı kesildi — yeniden deneniyor...';
      setTimeout(connectWS, 3000);
    };

    ws.onerror = () => ws.close();

    ws.onmessage = (event) => {
      try {
        handleNewMessage(JSON.parse(event.data));
      } catch (e) {
        console.error('WS parse error:', e);
      }
    };
  }

  function handleNewMessage(msg) {
    const chatId = msg.chat_id;
    if (!chatId) return;

    const name = contacts[chatId] || chatId;

    // Inbound → önceki outbound'ları "read" yap
    if (msg.direction === 'inbound' && conversations[chatId]?.msgs) {
      let updated = false;
      for (const m of conversations[chatId].msgs) {
        if (m.direction === 'outbound' && m.status !== 'read') {
          m.status = 'read';
          updated = true;
        }
      }
      if (updated && chatId === activeChatId) {
        renderMessages();
      }
    }

    if (!conversations[chatId]) {
      conversations[chatId] = {
        name: name,
        last_message: msg.body || '',
        last_timestamp: msg.timestamp || '',
        last_direction: msg.direction,
        last_status: msg.status,
        count: 1,
        msgs: [msg],
      };
    } else {
      const conv = conversations[chatId];
      conv.last_message = msg.body || '';
      conv.last_timestamp = msg.timestamp || '';
      conv.last_direction = msg.direction;
      conv.last_status = msg.status;
      conv.count++;
      if (conv.msgs) conv.msgs.push(msg);
    }

    if (chatId === activeChatId) {
      // Find tail logic — check last message direction
      const msgs = conversations[chatId].msgs;
      const showTail = msgs.length < 2 || msgs[msgs.length - 2].direction !== msg.direction;
      appendMessageBubble(msg, showTail);
      scrollToBottom();
    } else {
      unreadCounts[chatId] = (unreadCounts[chatId] || 0) + 1;
    }

    renderSidebar();
  }

  // ── Mobile back ──
  window.showSidebar = function() {
    mainEl.classList.remove('show-chat');
    activeChatId = null;
    emptyState.style.display = '';
    chatView.style.display = 'none';
    renderSidebar();
  };

  // ── Helpers ──
  function formatTime(ts) {
    if (!ts) return '';
    try {
      return new Date(ts).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    } catch { return ''; }
  }

  function formatDate(ts) {
    if (!ts) return '';
    try {
      const d = new Date(ts);
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      if (d.toDateString() === today.toDateString()) return 'Bugün';
      if (d.toDateString() === yesterday.toDateString()) return 'Dün';
      return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch { return ''; }
  }

  function formatPhone(phone) {
    if (!phone || phone.length < 10) return phone;
    // 905550001001 → +90 555 000 10 01
    const p = phone.startsWith('+') ? phone.slice(1) : phone;
    if (p.length === 12 && p.startsWith('90')) {
      return '+' + p.slice(0,2) + ' ' + p.slice(2,5) + ' ' + p.slice(5,8) + ' ' + p.slice(8,10) + ' ' + p.slice(10);
    }
    return phone;
  }

  function esc(s) {
    const el = document.createElement('span');
    el.textContent = s;
    return el.innerHTML;
  }

  // ── Profile Panel ──
  const profileOverlay = document.getElementById('profile-overlay');
  const profilePanel = document.getElementById('profile-panel');
  const profileBody = document.getElementById('profile-body');
  const profileClose = document.getElementById('profile-close');

  function openProfile(phone) {
    profileBody.innerHTML = '<div style="text-align:center;padding:40px;color:#8696a0">Yükleniyor...</div>';
    profileOverlay.classList.add('open');
    profilePanel.classList.add('open');

    fetch(BASE + '/api/profiles/' + encodeURIComponent(phone))
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(renderProfile)
      .catch(e => {
        profileBody.innerHTML = '<div style="text-align:center;padding:40px;color:#e74c3c">Profil yüklenemedi</div>';
      });
  }

  function closeProfile() {
    profileOverlay.classList.remove('open');
    profilePanel.classList.remove('open');
  }

  profileOverlay.addEventListener('click', closeProfile);
  profileClose.addEventListener('click', closeProfile);

  // Avatar click → open profile
  chatAvatar.style.cursor = 'pointer';
  chatAvatar.addEventListener('click', function() {
    if (activeChatId) openProfile(activeChatId);
  });

  function renderProfile(p) {
    const color = avatarColor(p.phone);
    const initials = p.name.split(' ').map(w => w[0]).join('').slice(0, 2);
    const patiencePct = Math.min(100, Math.round((p.patience_minutes / 35) * 100));

    let html = '';

    // Hero
    html += '<div class="profile-hero">';
    html += '<div class="profile-hero-avatar" style="background:' + color + '">' + esc(initials) + '</div>';
    html += '<div class="profile-hero-name">' + esc(p.name) + '</div>';
    html += '<div class="profile-hero-phone">' + esc(formatPhone(p.phone)) + '</div>';
    html += '</div>';

    // Customer Profile
    html += '<div class="profile-section">';
    html += '<div class="profile-section-title">Müşteri Profili</div>';
    html += '<div class="profile-field">';
    html += '<div class="profile-field-label">Kişilik</div>';
    html += '<div class="profile-field-value">' + esc(p.personality) + '</div>';
    html += '</div>';
    html += '<div class="profile-field">';
    html += '<div class="profile-field-label">Sabır Süresi</div>';
    html += '<div class="patience-bar">';
    html += '<div class="patience-track"><div class="patience-fill" style="width:' + patiencePct + '%"></div></div>';
    html += '<span class="patience-label">' + p.patience_minutes + ' dk</span>';
    html += '</div>';
    html += '</div>';
    html += '</div>';

    // System Prompt
    html += '<div class="profile-section">';
    html += '<div class="prompt-toggle" onclick="document.getElementById(\'prompt-content\').classList.toggle(\'open\');this.querySelector(\'button\').textContent=document.getElementById(\'prompt-content\').classList.contains(\'open\')?\'Kapat\':\'Aç\'">';
    html += '<div class="profile-section-title" style="margin-bottom:0">Sistem Promptu</div>';
    html += '<button class="prompt-toggle-btn">Aç</button>';
    html += '</div>';
    html += '<div class="prompt-content" id="prompt-content">';
    html += '<pre>' + esc(p.system_prompt) + '</pre>';
    html += '</div>';
    html += '</div>';

    // Agent Technical
    html += '<div class="profile-section">';
    html += '<div class="profile-section-title">Agent Teknik Bilgi</div>';
    html += '<div class="profile-field">';
    html += '<div class="profile-field-label">LLM</div>';
    html += '<div class="profile-field-value">' + esc(p.llm.provider) + ' / ' + esc(p.llm.model) + '</div>';
    html += '</div>';
    html += '<div class="profile-field">';
    html += '<div class="profile-field-label">Framework</div>';
    html += '<div class="profile-field-value">' + esc(p.framework) + '</div>';
    html += '</div>';
    html += '<div class="profile-field">';
    html += '<div class="profile-field-label">Araçlar</div>';
    html += '<div class="tool-list">' + p.tools.map(t => '<span class="tool-chip">' + esc(t) + '</span>').join('') + '</div>';
    html += '</div>';
    html += '</div>';

    // Discit
    html += '<div class="profile-section">';
    html += '<div class="profile-section-title">Discit (Karşı Taraf)</div>';
    html += '<div class="discit-info">';
    html += '<div class="discit-logo">D</div>';
    html += '<div class="discit-text">Karşı taraftaki sales agent <strong>Discit</strong> tarafından yönetilir. Gelen mesajlar Discit\'in integrations katmanından geçer.</div>';
    html += '</div>';
    html += '</div>';

    profileBody.innerHTML = html;
  }

  init();
})();
</script>
</body>
</html>
