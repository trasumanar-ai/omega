services:
  omega:
    build:
      context: ./src/backend
    ports:
      - "8090:8090"
    volumes:
      - omega-data:/data
    networks:
      - gov

  president:
    build:
      context: .
      dockerfile: agents/Dockerfile
    volumes:
      - ./agents/president:/home/node/.openclaw/workspace:ro
      - ./agents/shared/skills:/home/node/.openclaw/skills:ro
      - ./agents/shared/openclaw.json:/home/node/.openclaw/openclaw.json:ro
      - ./agents/shared/TOOLS.md:/home/node/.openclaw/workspace/TOOLS.md:ro
      - president-work:/home/node/work
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OMEGA_URL=http://omega:8090
      - OMEGA_GOV_ID=${OMEGA_GOV_ID}
      - OMEGA_AGENT_NAME=President
      - OMEGA_MODEL=stepfun/step-3.5-flash
    ports:
      - "18790:18789"
    networks:
      - gov
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache
    security_opt:
      - no-new-privileges:true
    depends_on:
      - omega

  senator-1:
    build:
      context: .
      dockerfile: agents/Dockerfile
    volumes:
      - ./agents/senator-1:/home/node/.openclaw/workspace:ro
