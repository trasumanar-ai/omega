services:
  omega:
    build:
      context: ./src/backend
    ports:
      - "8090:8090"
    volumes:
      - omega-data:/data
    networks:
      - gov

  president:
    image: ghcr.io/openclaw/openclaw:latest
    volumes:
      - ./agents/president:/home/node/.openclaw/workspace:ro
      - ./agents/shared/skills:/home/node/.openclaw/skills:ro
      - ./agents/shared/TOOLS.md:/home/node/.openclaw/workspace/TOOLS.md:ro
      - president-work:/home/node/work
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OMEGA_URL=http://omega:8090
      - OMEGA_GOV_ID=${OMEGA_GOV_ID}
      - OMEGA_API_KEY=${PRESIDENT_API_KEY}
    ports:
      - "18790:18789"
    networks:
      - gov
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - omega

  senator-1:
    image: ghcr.io/openclaw/openclaw:latest
    volumes:
      - ./agents/senator-1:/home/node/.openclaw/workspace:ro
      - ./agents/shared/skills:/home/node/.openclaw/skills:ro
      - ./agents/shared/TOOLS.md:/home/node/.openclaw/workspace/TOOLS.md:ro
      - senator1-work:/home/node/work
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OMEGA_URL=http://omega:8090
      - OMEGA_GOV_ID=${OMEGA_GOV_ID}
      - OMEGA_API_KEY=${SENATOR1_API_KEY}
    ports:
      - "18791:18789"
    networks:
      - gov
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - omega

  senator-2:
